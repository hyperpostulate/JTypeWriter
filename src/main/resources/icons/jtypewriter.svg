        <rect x="140" y="308" width="232" height="14" fill="#63452c"/>
        <rect x="140" y="322" width="232" height="10" fill="#4c3322"/>
      </g>
    </g>
    <g id="platen-roller">
      <rect x="162" y="294" width="188" height="36" rx="18" fill="#2c1b10"/>
      <g clip-path="url(#rollerClip)">
        <rect x="162" y="294" width="188" height="12" fill="#583f28"/>
        <rect x="162" y="306" width="188" height="12" fill="#3b281a"/>
      </g>
      <!-- rim light as a closed sliver, not a stroked path -->
      <path id="roller-rim-light" d="M180 304 Q256 297 332 304 L332 300 Q256 293 180 300 Z"
            fill="#9a7148" opacity="0.55"/>
    </g>
    <g id="roller-knobs">
      <circle cx="150" cy="312" r="13.5" fill="#3a2418"/>
      <circle cx="150" cy="312" r="6" fill="#9c7148"/>
      <circle cx="362" cy="312" r="13.5" fill="#3a2418"/>
      <circle cx="362" cy="312" r="6" fill="#9c7148"/>
    </g>
    <g id="body-deck">
      <path d="M166 344 H346 Q368 344 374 364 L388 416 Q391 430 377 430 H135 Q121 430 124 416 L138 364 Q144 344 166 344 Z"
            fill="#5e4029"/>
      <g id="deck-bands" clip-path="url(#deckClip)">
        <rect x="118" y="344" width="276" height="14" fill="#a67a4d"/>
        <rect x="118" y="358" width="276" height="15" fill="#976f46"/>
        <rect x="118" y="373" width="276" height="14" fill="#896440"/>
        <rect x="118" y="387" width="276" height="14" fill="#7c5a3b"/>
        <rect x="118" y="401" width="276" height="15" fill="#6d5033"/>
      </g>
      <!-- rim light as a closed sliver, not a stroked path -->
      <path id="deck-rim-light" d="M170 351 Q256 344 342 351 L342 347 Q256 340 170 347 Z"
            fill="#dbb183" opacity="0.5"/>
    </g>
    <g id="keys">
      <!-- key caps: three rows centred on the deck axis (x=256) - 7, 8, 7 caps -
           sized down and spread out so each cap keeps an air gap from its
           neighbours and from the deck's left/right edges. The last row sits
           clearly above the spacebar, which is a single centred bar, not part
           of the cap grid. -->
      <g fill="#35200f">
        <circle cx="169" cy="354.8" r="7.2"/><circle cx="198" cy="354.8" r="7.2"/><circle cx="227" cy="354.8" r="7.2"/>
        <circle cx="256" cy="354.8" r="7.2"/><circle cx="285" cy="354.8" r="7.2"/><circle cx="314" cy="354.8" r="7.2"/>
        <circle cx="343" cy="354.8" r="7.2"/>
        <circle cx="165" cy="373.8" r="7.2"/><circle cx="191" cy="373.8" r="7.2"/><circle cx="217" cy="373.8" r="7.2"/>
        <circle cx="243" cy="373.8" r="7.2"/><circle cx="269" cy="373.8" r="7.2"/><circle cx="295" cy="373.8" r="7.2"/>
        <circle cx="321" cy="373.8" r="7.2"/><circle cx="347" cy="373.8" r="7.2"/>
        <circle cx="169" cy="392.8" r="7.2"/><circle cx="198" cy="392.8" r="7.2"/><circle cx="227" cy="392.8" r="7.2"/>
        <circle cx="256" cy="392.8" r="7.2"/><circle cx="285" cy="392.8" r="7.2"/><circle cx="314" cy="392.8" r="7.2"/>
        <circle cx="343" cy="392.8" r="7.2"/>
      </g>
      <g fill="#cfa06e">
        <circle cx="169" cy="357" r="6"/><circle cx="198" cy="357" r="6"/><circle cx="227" cy="357" r="6"/>
        <circle cx="256" cy="357" r="6"/><circle cx="285" cy="357" r="6"/><circle cx="314" cy="357" r="6"/>
        <circle cx="343" cy="357" r="6"/>
        <circle cx="165" cy="376" r="6"/><circle cx="191" cy="376" r="6"/><circle cx="217" cy="376" r="6"/>
        <circle cx="243" cy="376" r="6"/><circle cx="269" cy="376" r="6"/><circle cx="295" cy="376" r="6"/>
        <circle cx="321" cy="376" r="6"/><circle cx="347" cy="376" r="6"/>
        <circle cx="169" cy="395" r="6"/><circle cx="198" cy="395" r="6"/><circle cx="227" cy="395" r="6"/>
        <circle cx="256" cy="395" r="6"/><circle cx="285" cy="395" r="6"/><circle cx="314" cy="395" r="6"/>
        <circle cx="343" cy="395" r="6"/>
      </g>
      <rect id="spacebar-shadow" x="206" y="412" width="100" height="14" rx="7" fill="#35200f"/>
      <rect id="spacebar" x="206" y="409" width="100" height="14" rx="7" fill="#cfa06e"/>
    </g>
  </g>

  <g id="plinth">
    <rect x="76" y="424" width="360" height="30" rx="11" fill="#4e3320"/>
