<?xml version="1.0" encoding="UTF-8"?>
<!--
  JTypeWriter application icon - canonical 512x512 artwork.

  Design intent: an aged film photograph of a CRT monitor and a vintage
  typewriter on a wooden plinth. The monitor shows olive-green phosphor
  (scanlines and abstract text lines); the typewriter is muted
  walnut/sepia brown. A sheet of aged cream paper rises straight out of the
  roller toward the screen, tying "typing" to "screen". No text/letters
  anywhere - language neutral. The whole frame carries a low-key retro-film
  patina: warm desaturation, flat glass without sheen, and hand-placed dust
  specks and emulsion scratches (#film-grain). Dustier, never murkier: the
  brown typewriter must still read clearly against the green screen at 16x16,
  so the grain lives mostly in the outer margins and the contrast
  relationships (paper vs screen, keys vs deck) are preserved. No vignette
  and no halo/glow layers by design: the frame is evenly lit and every glow
  is drawn as a flat shape, not a gradient falloff.

  Palette:
    greens  #355235 #496a45 #577a51 #2d5030   (olive-grey monitor / CRT)
            #a9c98b #b7c98a                   (aged phosphor, dimmed LED)
    browns  #3a2418 #5e4029 #a67a4d #cfa06e   (typewriter / plinth, muted)
    paper   #e8dbba -> #d4d2a6, faint green   (aged cream sheet)
    film    #241a0e/#e9dcb2 grain (warm dark / cream dust)

  Technique notes (IMPORTANT - renders through ImageMagick's internal MSVG):
    This rasterizer paints every url(#gradient) fill as solid black, so this
    file deliberately contains NO linearGradient/radialGradient elements.
    Gradients are simulated with clipped bands of interpolated solid colors
    (see #bezel-bands, #deck-bands, #roller-bands) and the contact shadow is
    a stack of low-opacity ellipses instead of a blur filter. Highlights are
    CLOSED filled slivers, never stroked open paths, and stroked shapes use
    fill="transparent" not fill="none" - MSVG floods open stroked shapes
    with black.
    #film-grain is hand-placed primitives (jittered positions and opacities,
    denser at the frame edges, clear of the text lines and keys) because
    MSVG ignores <filter>/feTurbulence and a <pattern> grid would read as a
    rendering bug at small sizes.
    To restyle: shift the band colors within each group's color range and
    keep light-on-top order; groups carry ids. Primitives + opacity +
    clipPath only, so the PNG pipeline (`magick -background none
    -density 384 jtypewriter.svg -resize NxN PNG32:...`) stays faithful.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="bezelClip">
      <rect x="78" y="44" width="356" height="386" rx="36"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="104" y="70" width="304" height="246" rx="26"/>
    </clipPath>
    <clipPath id="frameClip">
      <rect x="140" y="308" width="232" height="48" rx="15"/>
    </clipPath>
    <clipPath id="rollerClip">
      <rect x="162" y="294" width="188" height="36" rx="18"/>
    </clipPath>
    <clipPath id="deckClip">
      <path d="M166 344 H346 Q368 344 374 364 L388 416 Q391 430 377 430 H135 Q121 430 124 416 L138 364 Q144 344 166 344 Z"/>
    </clipPath>
    <clipPath id="paperClip">
      <rect x="198" y="168" width="116" height="176"/>
    </clipPath>
  </defs>

  <!-- soft contact shadow under everything, warmed to sepia -->
  <g id="ground-shadow" fill="#130d06">
    <ellipse cx="256" cy="462" rx="202" ry="20" opacity="0.06"/>
    <ellipse cx="256" cy="462" rx="178" ry="17.5" opacity="0.07"/>
    <ellipse cx="256" cy="462" rx="154" ry="15" opacity="0.08"/>
    <ellipse cx="256" cy="462" rx="130" ry="12.5" opacity="0.09"/>
    <ellipse cx="256" cy="462" rx="106" ry="10" opacity="0.11"/>
    <ellipse cx="256" cy="462" rx="82" ry="7.5" opacity="0.13"/>
  </g>

  <g id="monitor">
    <!-- bezel: dusty olive-grey bands, lit from above, deeper tube shade below -->
    <g id="bezel-bands" clip-path="url(#bezelClip)">
      <rect x="78" y="44" width="356" height="48" fill="#577a51"/>
      <rect x="78" y="92" width="356" height="49" fill="#53754d"/>
      <rect x="78" y="141" width="356" height="48" fill="#4e6f49"/>
      <rect x="78" y="189" width="356" height="48" fill="#496a45"/>
      <rect x="78" y="237" width="356" height="48" fill="#446441"/>
      <rect x="78" y="285" width="356" height="49" fill="#3f5e3d"/>
      <rect x="78" y="334" width="356" height="48" fill="#3a5839"/>
      <rect x="78" y="382" width="356" height="48" fill="#355235"/>
    </g>
    <!-- tube falloff: the chin sits deeper in shadow than the crown -->
    <g id="bezel-bottom-shade" clip-path="url(#bezelClip)" fill="#171106">
      <rect x="78" y="366" width="356" height="28" opacity="0.06"/>
      <rect x="78" y="394" width="356" height="36" opacity="0.09"/>
    </g>
    <rect id="bezel-edge" x="78" y="44" width="356" height="386" rx="36"
          fill="transparent" stroke="#6d8a60" stroke-width="3" stroke-opacity="0.5"/>
    <rect id="screen" x="104" y="70" width="304" height="246" rx="26" fill="#2d5030"/>
    <g id="screen-content" clip-path="url(#screenClip)">
      <g id="scanlines" fill="#11150c" opacity="0.2">
        <rect x="104" y="82" width="304" height="4"/>
        <rect x="104" y="94" width="304" height="4"/>
        <rect x="104" y="106" width="304" height="4"/>
        <rect x="104" y="118" width="304" height="4"/>
        <rect x="104" y="130" width="304" height="4"/>
        <rect x="104" y="142" width="304" height="4"/>
        <rect x="104" y="154" width="304" height="4"/>
        <rect x="104" y="166" width="304" height="4"/>
        <rect x="104" y="178" width="304" height="4"/>
        <rect x="104" y="190" width="304" height="4"/>
        <rect x="104" y="202" width="304" height="4"/>
        <rect x="104" y="214" width="304" height="4"/>
        <rect x="104" y="226" width="304" height="4"/>
        <rect x="104" y="238" width="304" height="4"/>
        <rect x="104" y="250" width="304" height="4"/>
        <rect x="104" y="262" width="304" height="4"/>
        <rect x="104" y="274" width="304" height="4"/>
        <rect x="104" y="286" width="304" height="4"/>
        <rect x="104" y="298" width="304" height="4"/>
      </g>
      <g id="text-lines" fill="#a9c98b">
        <rect x="128" y="96" width="96" height="9" rx="4.5" opacity="0.72"/>
        <rect x="128" y="116" width="152" height="9" rx="4.5" opacity="0.68"/>
        <rect x="128" y="136" width="64" height="9" rx="4.5" opacity="0.64"/>
        <rect x="200" y="133" width="11" height="15" rx="2" opacity="0.78"/>
        <rect x="336" y="190" width="52" height="8" rx="4" opacity="0.45"/>
        <rect x="336" y="208" width="38" height="8" rx="4" opacity="0.36"/>
      </g>
      <!-- inner shadow under the top bezel -->
      <g id="screen-top-shade" fill="#0e130a">
        <rect x="104" y="70" width="304" height="20" opacity="0.35"/>
        <rect x="104" y="90" width="304" height="20" opacity="0.18"/>
        <rect x="104" y="110" width="304" height="16" opacity="0.09"/>
      </g>
      <!-- tube falloff darkening the bottom of the glass -->
      <g id="screen-bottom-shade" fill="#161006">
        <rect x="104" y="258" width="304" height="20" opacity="0.05"/>
        <rect x="104" y="278" width="304" height="20" opacity="0.08"/>
        <rect x="104" y="298" width="304" height="18" opacity="0.11"/>
      </g>
    </g>
    <g id="chin-vents" fill="#1d2517" opacity="0.5">
      <rect x="92" y="340" width="28" height="6" rx="3"/>
      <rect x="92" y="354" width="28" height="6" rx="3"/>
      <rect x="92" y="368" width="28" height="6" rx="3"/>
    </g>
    <g id="power-led">
      <circle cx="408" cy="352" r="11" fill="#b7c98a" opacity="0.1"/>
      <circle cx="408" cy="352" r="5" fill="#a3be7d"/>
    </g>
  </g>

  <g id="paper">
    <rect id="sheet" x="198" y="168" width="116" height="176" rx="2" fill="#e8dbba"/>
    <g id="paper-content" clip-path="url(#paperClip)">
      <!-- straight left-edge shadow and right-edge highlight, green cast near the screen -->
      <rect x="198" y="168" width="38" height="176" fill="#97a07c" opacity="0.16"/>
      <rect x="289" y="168" width="25" height="176" fill="#b3a67b" opacity="0.18"/>
      <rect x="198" y="272" width="116" height="72" fill="#8f9871" opacity="0.16"/>
      <g id="written-lines" fill="#7f8a66" opacity="0.62">
        <rect x="216" y="184" width="70" height="6" rx="3"/>
        <rect x="216" y="200" width="82" height="6" rx="3"/>
        <rect x="216" y="216" width="54" height="6" rx="3"/>
      </g>
    </g>
    <!-- top edge highlight: closed sliver, not a stroked path
         (MSVG floods multi-segment open stroked paths with black) -->
    <rect id="sheet-highlight" x="198" y="168" width="116" height="7" rx="2"
          fill="#e6d6ac" opacity="0.5"/>
  </g>

  <g id="typewriter">
    <g id="carriage-lever">
      <path d="M160.9 305.3 L126.9 269.3 L121.1 274.7 L155.1 310.7 Z" fill="#3a2418"/>
      <circle cx="121" cy="269" r="8.5" fill="#cfa06e"/>
