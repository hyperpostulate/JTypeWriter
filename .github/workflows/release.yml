# Publishes a GitHub Release from a version tag.
#
# A `v*` tag is the one place where "the version we built" and "the version we
# promised" can disagree, so prepare refuses to continue unless the tag is
# exactly v<pom version>. Two OS builds then package installers and portable
# archives, and a single publish job merges them, checksums the lot and uploads
# the result to the Release itself. Uploading to the Release - not to Actions
# artifacts - is what ends the 90-day expiry problem: the release
# is the durable copy, the artifact upload between jobs lives for one day.
#
# The pipeline can also be run by hand, as a dry run: every step that produces
# the release - prepare, both OS builds, the asset/source/checksum assembly, the
# five-asset assertion and the release-note rendering - runs exactly as it will
# on the real day, and only the publication itself is replaced by an artifact
# upload. That is the difference between "the release workflow is well designed"
# and "the release workflow has run": before the first tag, every step of it was
# a hypothesis, and a tag is the least convenient moment to discover that the
# asset names, the note rendering or the missing Windows file were wrong.
#
# A manual run can never publish, and that is deliberate rather than a missing
# feature. A release built from a branch tip could not be reproduced from
# $GITHUB_REF_NAME, which is the whole provenance claim a tag makes; so the
# `dry_run` input defaults to true and asking for false is refused in prepare
# with an explanation instead of failing later at `--verify-tag`.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and assemble everything, publish nothing'
        type: boolean
        default: true

# Reading the repository is enough for prepare and the two build legs. The
# publish job alone gets contents: write below (GitHub has no step-level
# permissions, so the write grant has to be scoped to a whole job).
permissions:
  contents: read

jobs:
  prepare:
    name: Check the version and decide between publish and dry run
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      # Every action is pinned to a full commit SHA: a mutable tag can be
      # re-pointed at another commit and would then run with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes; keeping the token out of .git/config keeps it
          # out of every later step.
          persist-credentials: false

      # A release whose tag disagrees with the built version would be
      # unverifiable - the asset names say one thing and the jar says another -
      # so this fails before both OS builds run. A dry run skips the comparison
      # because there is no tag to compare against, but it still refuses any
      # version jpackage or the release-asset naming could not carry.
      #
      # The first <version> element is the project version: this build has no
      # parent POM, so there is no parent <version> ahead of it to skip.
      - name: Read the project version and decide publish vs dry run
        id: version
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "could not read a release version from pom.xml (got '$version')" >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "tag '$GITHUB_REF_NAME' does not match pom.xml version '$version'" >&2
              echo "a release built from this tag would not be reproducible - tag $tag instead" >&2
              exit 1
            fi
            publish=true
            echo "tag $tag accepted; this run publishes"
          else
            # Only a tag push carries the provenance a release claims. A manual
            # run that asked to publish is refused here, before two OS builds
            # spend ten minutes on something that could never be uploaded.
            if [[ "${DRY_RUN_INPUT:-true}" != "true" ]]; then
              echo "a manual run cannot publish: only a tag push can" >&2
              echo "push $tag to release $version, or re-run this workflow with dry_run=true" >&2
              exit 1
            fi
            publish=false
            echo "manual run: dry run for $tag, nothing will be published"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build & package (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Pin the exact commit the tag points at, not whatever the branch has
          # moved to by the time this job starts.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --file pom.xml

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build application image and platform installer
        shell: bash
        run: bash scripts/package.sh --skip-build --installer

      # release-assets.sh speaks the same vocabulary as the file names it
      # produces; runner.os / runner.arch are the only platform facts available
      # before the asset exists, so they are translated here.
      - name: Resolve asset platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   os=linux ;;
            Windows) os=windows ;;
            *) echo "unsupported runner.os '${{ runner.os }}'" >&2; exit 1 ;;
          esac
          case "${{ runner.arch }}" in
            X64)   arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner.arch '${{ runner.arch }}'" >&2; exit 1 ;;
          esac
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Stage normalised release assets
        shell: bash
        run: |
          bash scripts/release-assets.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ steps.platform.outputs.os }}" \
            "${{ steps.platform.outputs.arch }}" \
            "$GITHUB_WORKSPACE/releases/${{ steps.platform.outputs.os }}" \
            "$GITHUB_WORKSPACE/dist"

      # This is only the in-flight hop between the OS legs and the publish
      # job: one day is plenty, and the Release asset is the durable copy, so a
      # 90-day expiry is no longer a thing that can happen.
      - name: Upload staged assets for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JTypeWriter-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Assemble and publish (or stage a dry run)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the Release; a dry run never uses it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag must exist locally for git archive and --verify-tag; no push
          # credential is needed for either.
          persist-credentials: false

      - name: Download staged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: JTypeWriter-*
          merge-multiple: true
          path: dist

      # Apache-2.0 makes a source offer optional, but a checksummed
      # source archive next to the binaries removes the question entirely.
      #
      # The archive is cut from $GITHUB_SHA rather than from a tag name so that a
      # dry run - where the tag does not exist yet - runs the same line as the
      # real release. On the real path the tag push made this SHA the tagged
      # commit, so the contents are identical either way.
      - name: Add the source archive
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="JTypeWriter-${{ needs.prepare.outputs.version }}/" \
            -o "dist/JTypeWriter-${{ needs.prepare.outputs.version }}-source.tar.gz" \
            "$GITHUB_SHA"

      - name: Generate checksums
        shell: bash
        run: bash scripts/checksums.sh dist

      # A silently missing Windows asset is exactly the bug this job exists to
      # prevent, so the listing is asserted, not assumed. It runs before the
      # publish/dry-run split on purpose: the assertion is one of the things the
      # dry run exists to prove, so it must be able to fail there.
      - name: Verify the expected assets are present
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          expected=(
            "JTypeWriter-$version-linux-x64.deb"
            "JTypeWriter-$version-linux-x64.tar.gz"
            "JTypeWriter-$version-windows-x64.msi"
            "JTypeWriter-$version-windows-x64.tar.gz"
            "JTypeWriter-$version-source.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "missing expected release asset: dist/$asset" >&2
              echo "dist/ contains:" >&2
              ls -la dist >&2
              exit 1
            fi
          done
          if [[ ! -f dist/SHA256SUMS ]]; then
            echo "dist/SHA256SUMS was not produced" >&2
            exit 1
          fi
          sums=$(find dist -maxdepth 1 -type f -name SHA256SUMS | wc -l)
          if [[ "$sums" -ne 1 ]]; then
            echo "expected exactly one SHA256SUMS under dist/, found $sums" >&2
            ls -la dist >&2
            exit 1
          fi

      # The body lives in the repository, not in this file: the release note is
      # the one document every user reads, and this project documents itself in
      # English and Turkish with the same sections in the same order. Keeping it
      # as a checked-in template makes that pairing reviewable (a diff shows both
      # halves) instead of hiding it inside an inline block.
      #
      # The template carries @VERSION@ and @TAG@ placeholders; the checks below
      # make a half-rendered note impossible to publish.
      - name: Write release notes
        shell: bash
        run: |
          sed \
            -e "s/@VERSION@/${{ needs.prepare.outputs.version }}/g" \
            -e "s/@TAG@/${{ needs.prepare.outputs.tag }}/g" \
            docs/release-notes-template.md > "$RUNNER_TEMP/release-notes.md"

          if grep -n '@[A-Z][A-Z_]*@' "$RUNNER_TEMP/release-notes.md"; then
            echo "unsubstituted placeholder in the release notes above" >&2
            exit 1
          fi
          # A template that lost one language would still render, so the release
          # job is the last place that can notice. Both headings are required.
          for heading in '^## English$' '^## Türkçe$'; do
            if ! grep -qx "$heading" "$RUNNER_TEMP/release-notes.md"; then
              echo "release notes are missing the section: $heading" >&2
              exit 1
            fi
          done

      # gh is already on the runners, so publishing needs no extra pinned
      # dependency (and no third-party action) in the job that holds the write
      # token. --verify-tag matters because a tag that only exists locally would
      # otherwise get a Release pointing at a commit nobody can fetch.
      #
      # Guarded rather than removed: the publish path must exist for a tag push
      # and must not be reachable from a manual run, and the guard is the only
      # thing that makes that true.
      - name: Create the GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "JTypeWriter ${{ needs.prepare.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # The dry run keeps exactly what the release would have uploaded, so the
      # assembled set can be downloaded and inspected instead of described.
      - name: Upload the dry-run release bundle
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JTypeWriter-release-dry-run-${{ needs.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Say what happened
        shell: bash
        run: |
          if [[ "${{ needs.prepare.outputs.publish }}" == "true" ]]; then
            echo "published ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dry run - nothing was published"
              echo
              echo "Every step of the release ran for \`${{ needs.prepare.outputs.tag }}\`;"
              echo "the assembled assets are attached to this run as"
              echo "\`JTypeWriter-release-dry-run-${{ needs.prepare.outputs.version }}\`."
              echo "No tag was created and no Release exists for this version."
              echo
              echo "<details><summary>Rendered release notes</summary>"
              echo
              cat "$RUNNER_TEMP/release-notes.md"
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
