# Builds, tests and packages JTypeWriter on every platform we ship for.
# Each job runs the test suite and then calls scripts/package.sh, which
# produces the native application image and wraps it into the platform
# installer (.deb / .msi / .dmg). The application version lives in pom.xml
# only - package.sh reads it back from the build - so nothing here can drift.
# The results are uploaded, so releases are always reproducible from source.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The badge publisher pushes badges/tests.json to the gh-pages branch.
permissions:
  contents: write

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --file pom.xml

      # Localization regressions hide behind the system locale: the i18n tests
      # must pass on a Turkish and a German machine too (see MessagesTest).
      - name: Re-run tests under non-English system locales
        shell: bash
        run: |
          mvn -B test --file pom.xml -DargLine="-Duser.language=tr -Duser.country=TR"
          mvn -B test --file pom.xml -DargLine="-Duser.language=de -Duser.country=DE"

      # Only one matrix leg publishes the badge, so the three OS runs do not
      # race on the gh-pages branch; fork PRs have no token and must not try.
      # A failed publish only warns, so it can never turn a green build red.
      - name: Publish test count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-test-badge.sh

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build application image and platform installer
        shell: bash
        run: bash scripts/package.sh --skip-build --installer

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JTypeWriter-${{ matrix.os }}
          path: releases/
          if-no-files-found: error