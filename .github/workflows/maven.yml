# Builds, tests and packages JTypeWriter on every platform we ship for.
#
# The build itself lives in the shared verify-build.yml workflow, because the
# release pipeline has to run exactly the same gates: one definition is the
# only way a branch and a tag can be proven the same way. This file is the
# pull-request entry point plus the badge publisher, which is the one job that
# needs a write token and therefore stays outside the shared workflow.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Checkout and the build need nothing beyond reading the repository. The badge
# publisher is the only writer and gets its own job-level grant below.
permissions:
  contents: read

jobs:
  # Icon hashes, the build, the tr-TR/de-DE runs, package.sh, the byte
  # comparison and the smoke launch: all of it is the called workflow's job, so
  # this entry point cannot run a cheaper subset. The release pipeline calls the
  # same workflow with a version, and CiGatesTest keeps both callers honest.
  build:
    name: Build and verify
    uses: ./.github/workflows/verify-build.yml

  # GitHub has no step-level permissions, so the badge push to gh-pages lives in
  # its own job: only this job needs contents: write. It runs only one leg of
  # the build, so the OS runs do not race on the gh-pages branch, and fork
  # PRs have no token and must not try. A failed publish fails this job: a badge
  # that silently goes stale is the bug this job exists to prevent.
  badge:
    name: Publish test count badge
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # only this job pushes to gh-pages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The badge publisher authenticates with the token it is handed
          # explicitly, so no credential needs to sit in .git/config.
          persist-credentials: false

      # The artifact keeps one directory per locale run under its root, so it is
      # unpacked one level up: the publisher must see target/surefire-reports*
      # (main, -tr, -de), not a single flattened directory.
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: surefire-reports
          path: target

      - name: Publish test count badge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-test-badge.sh
