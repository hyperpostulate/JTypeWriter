# Keeps the CI workflow supplied without a manual chore.
#
# maven.yml pins every action to a full commit SHA (PW-12): a mutable major tag
# can be re-pointed at any commit, and one of these steps holds a write token.
# The price of that hardening is that a security release no longer reaches us
# on its own, so Dependabot bumps the SHA and the "# v4.x.y" comment beside it
# in a normal pull request. Nothing here runs on a schedule of its own; the
# workflow stays untouched until such a PR is merged.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR for the whole workflow: the four actions belong to the same
    # supply chain and are easier to review - and to revert - together.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
    labels:
      - ci
